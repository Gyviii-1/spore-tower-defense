<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover + user-scalable=no: полноэкранный режим без зума на телефоне -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Spore Tower Defense // S.A.M. Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Telegram Mini App SDK: даёт доступ к данным пользователя и нативному Fullscreen -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      function requestAppFs() {
        if (window.Telegram && window.Telegram.WebApp) {
          var tg = window.Telegram.WebApp;
          try {
            tg.ready();
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
            if (typeof tg.requestFullscreen === 'function' && !tg.isFullscreen) {
              tg.requestFullscreen();
            }
          } catch (e) {}
        }
      }
      requestAppFs();
      window.addEventListener('pointerdown', requestAppFs, { passive: true });
      window.addEventListener('click', requestAppFs, { passive: true });
    })();
  </script>
  <style>
    /* Убираем отступы браузера, растягиваем игру на весь экран */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020703;
      font-family: 'Share Tech Mono', 'Courier New', Consolas, Lucida Console, monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      /* Чтобы тапы не выделяли текст и не зумили страницу на мобильных */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    /* Контейнер, в который Phaser вставит <canvas> */
    #game {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game canvas {
      display: block;
      filter: drop-shadow(0 0 2px rgba(51, 255, 102, 0.22));
    }

    /* Ретро-терминал: кинескопный CRT-оверлей (скан-линии, виньетка, свечение люминофора) */
    .crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99998;
      overflow: hidden;
      animation: crt-flicker 0.16s infinite;
    }

    /* Горизонтальные строки растра (скан-линии) */
    .crt-scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        rgba(10, 20, 10, 0) 50%,
        rgba(0, 0, 0, 0.28) 50%
      );
      background-size: 100% 3px;
      opacity: 0.8;
    }

    /* Затемнение по краям (кривизна кинескопа) и зеленоватый ореол */
    .crt-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 35px rgba(0, 15, 5, 0.75),
                  inset 0 0 12px rgba(0, 255, 102, 0.12);
      border: 1px solid rgba(0, 255, 102, 0.22);
    }

    /* Угловые прицельные рамки терминала */
    .crt-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(51, 255, 102, 0.45);
      pointer-events: none;
    }
    .crt-corner.top-left { top: max(6px, env(safe-area-inset-top)); left: max(6px, env(safe-area-inset-left)); border-right: none; border-bottom: none; }
    .crt-corner.top-right { top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); border-left: none; border-bottom: none; }
    .crt-corner.bottom-left { bottom: max(6px, env(safe-area-inset-bottom)); left: max(6px, env(safe-area-inset-left)); border-right: none; border-top: none; }
    .crt-corner.bottom-right { bottom: max(6px, env(safe-area-inset-bottom)); right: max(6px, env(safe-area-inset-right)); border-left: none; border-top: none; }

    /* Верхняя статусная строка терминала S.A.M. */
    .crt-terminal-header {
      position: fixed;
      top: max(4px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(8px, 1.8vw, 11px);
      letter-spacing: 1.5px;
      color: rgba(51, 255, 102, 0.45);
      text-shadow: 0 0 4px rgba(51, 255, 102, 0.35);
      pointer-events: none;
      z-index: 99997;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Легчайшее дрожание кинескопа */
    @keyframes crt-flicker {
      0% { opacity: 0.985; }
      50% { opacity: 1; }
      100% { opacity: 0.988; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Ретро-терминал: кинескопный CRT-оверлей (скан-линии, виньетка, угловые рамки) -->
  <div class="crt-overlay" aria-hidden="true">
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>
    <div class="crt-corner top-left"></div>
    <div class="crt-corner top-right"></div>
    <div class="crt-corner bottom-left"></div>
    <div class="crt-corner bottom-right"></div>
  </div>
  <div class="crt-terminal-header">[ S.A.M. OS v2.84 // ТАКТИЧЕСКИЙ ТЕРМИНАЛ // КЛАСС «ОМЕГА» ]</div>

  <!-- Экран загрузки / заставка (видео) -->
  <div id="splash-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000000;z-index:999999;display:flex;align-items:center;justify-content:center;transition:opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);overflow:hidden;">
    <video id="splash-video" src="assets/splash.mp4?v=20261021silent" playsinline webkit-playsinline autoplay muted preload="auto" style="width:100%;height:100%;object-fit:contain;pointer-events:none;"></video>
  </div>

  <script>
    (function () {
      const splash = document.getElementById('splash-screen');
      const video = document.getElementById('splash-video');

      if (!splash || !video) return;

      let dismissed = false;
      let gameLoaded = false;
      let playedOnceToEnd = false;

      function dismissSplash() {
        if (dismissed) return;
        dismissed = true;
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function () {
          try { video.pause(); } catch (e) {}
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 650);
      }

      function onGameReady() {
        gameLoaded = true;
        // Закрываем только если видео уже дошло до самого конца ролика
        if (playedOnceToEnd) {
          dismissSplash();
        }
      }

      function onVideoReachEnd() {
        playedOnceToEnd = true;
        if (gameLoaded) {
          dismissSplash();
        } else if (video.duration) {
          // Игра ещё грузится — перематываем на последнюю секунду и зацикливаем
          const loopStart = Math.max(0, video.duration - 1.0);
          video.currentTime = loopStart;
          video.play().catch(function () {});
        }
      }

      function handleVideoProgress() {
        if (!video.duration) return;
        if (video.currentTime >= video.duration - 0.06) {
          onVideoReachEnd();
        }
      }

      video.addEventListener('timeupdate', handleVideoProgress);
      video.addEventListener('ended', onVideoReachEnd);
      video.addEventListener('error', dismissSplash);

      // Связка с движком игры: вызывается, когда MenuScene готова
      window.dismissSplash = onGameReady;
      if (window.__gameLoaded) {
        onGameReady();
      }

      // Без звука видео гарантированно запускается сразу без клика
      video.play().catch(function () {});
    })();
  </script>

  <!-- Phaser 3 подключаем через CDN (ничего скачивать не нужно) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- Telegram Mini App SDK: даёт доступ к данным пользователя (ник, id) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Наш игровой код. Firebase (firebase-config.js) подгружается лениво,
       только при сохранении рекорда — чтобы сайт открывался быстрее. -->
  <script type="module" src="game.js?v=20261024fixes4"></script>
</body>
</html>
