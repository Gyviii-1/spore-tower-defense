<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
    <title>Unity Web Player | SporeTD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css?v=20261111_nobars">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #020703;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        display: block;
        font-family: 'Share Tech Mono', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: #020703;
        overflow: hidden;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #020703;
        filter: drop-shadow(0 0 2px rgba(51, 255, 102, 0.22));
      }

      /* Ретро-терминал: кинескопный CRT-оверлей (скан-линии, виньетка, свечение люминофора) */
      .crt-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 99998;
        overflow: hidden;
        animation: crt-flicker 0.16s infinite;
      }

      /* Горизонтальные строки растра (скан-линии) */
      .crt-scanlines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(
          rgba(10, 20, 10, 0) 50%,
          rgba(0, 0, 0, 0.42) 50%
        );
        background-size: 100% 3px;
        opacity: 0.9;
      }

      /* Затемнение по краям (кривизна кинескопа) и зеленоватый ореол */
      .crt-vignette {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        box-shadow: inset 0 0 80px rgba(0, 20, 5, 0.85),
                    inset 0 0 22px rgba(0, 255, 102, 0.18);
        border: 1px solid rgba(0, 255, 102, 0.28);
      }

      /* Угловые прицельные рамки терминала */
      .crt-corner {
        position: absolute;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(51, 255, 102, 0.65);
        box-shadow: 0 0 5px rgba(51, 255, 102, 0.35);
        pointer-events: none;
      }
      .crt-corner.top-left { top: 8px; left: 8px; border-right: none; border-bottom: none; }
      .crt-corner.top-right { top: 8px; right: 8px; border-left: none; border-bottom: none; }
      .crt-corner.bottom-left { bottom: 8px; left: 8px; border-right: none; border-top: none; }
      .crt-corner.bottom-right { bottom: 8px; right: 8px; border-left: none; border-top: none; }

      /* Верхняя статусная строка терминала S.A.M. */
      .crt-terminal-header {
        position: absolute;
        top: 4px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 2px;
        color: #33FF66;
        text-shadow: 0 0 5px rgba(51, 255, 102, 0.6);
        opacity: 0.75;
        pointer-events: none;
        z-index: 99999;
        text-transform: uppercase;
        white-space: nowrap;
        font-family: 'Share Tech Mono', 'Courier New', Consolas, monospace;
      }

      @keyframes crt-flicker {
        0% { opacity: 0.985; }
        50% { opacity: 1; }
        100% { opacity: 0.988; }
      }
    </style>
    <script src="TemplateData/profiler.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1"></canvas>
      <!-- Ретро-терминал: кинескопный CRT-оверлей (скан-линии, виньетка, угловые рамки) -->
      <div class="crt-overlay" aria-hidden="true">
        <div class="crt-scanlines"></div>
        <div class="crt-vignette"></div>
        <div class="crt-corner top-left"></div>
        <div class="crt-corner top-right"></div>
        <div class="crt-corner bottom-left"></div>
        <div class="crt-corner bottom-right"></div>
      </div>
      <div class="crt-terminal-header">[ S.A.M. OS v2.84 // ТАКТИЧЕСКИЙ ТЕРМИНАЛ // КЛАСС «ОМЕГА» ]</div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer" style="display:none !important;">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SporeTD</div>
      </div>
    </div>

    <!-- Rotate Device Overlay (iOS / unsupported orientation lock fallback) -->
    <div id="rotate-prompt-overlay" style="display:none;">
      <div class="rotate-prompt-box">
        <div class="rotate-icon">📱 ➔ 🔄</div>
        <div class="rotate-title">Поверните устройство</div>
        <div class="rotate-desc">Для комфортной игры переверните экран в горизонтальное положение.</div>
        <button class="rotate-dismiss-btn" id="rotate-dismiss-btn">Продолжить</button>
      </div>
    </div>

    <script>
      // Telegram WebApp init & Fullscreen Controller (Bot API 8.0+)
      function requestAppFullscreen() {
        if (window.Telegram && window.Telegram.WebApp) {
          var tg = window.Telegram.WebApp;
          try {
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
            if (typeof tg.requestFullscreen === 'function' && !tg.isFullscreen) {
              tg.requestFullscreen();
            }
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#14121A');
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#14121A');
          } catch (e) {
            console.warn('[TelegramWebApp] requestFullscreen warning:', e);
          }
        }

        try {
          var de = document.documentElement;
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            var p = null;
            if (de.requestFullscreen) p = de.requestFullscreen();
            else if (de.webkitRequestFullscreen) p = de.webkitRequestFullscreen();
            else if (de.mozRequestFullScreen) p = de.mozRequestFullScreen();
            else if (de.msRequestFullscreen) p = de.msRequestFullscreen();
            if (p && p.catch) p.catch(function(err) {});
          }
        } catch (e) {}
      }

      function initTelegramApp() {
        if (window.Telegram && window.Telegram.WebApp) {
          var tg = window.Telegram.WebApp;
          try {
            tg.ready();
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
            if (typeof tg.requestFullscreen === 'function') {
              tg.requestFullscreen();
            }
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor('#14121A');
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor('#14121A');

            if (typeof tg.onEvent === 'function') {
              tg.onEvent('fullscreenFailed', function(error) {
                console.warn('[TelegramWebApp] Fullscreen request deferred until user touch:', error);
              });
              tg.onEvent('fullscreenChanged', function() {
                console.log('[TelegramWebApp] Fullscreen state changed. isFullscreen =', tg.isFullscreen);
              });
            }
          } catch (e) {
            console.warn('[TelegramWebApp] init warning:', e);
          }
        }
      }
      initTelegramApp();

      // Ensure fullscreen is requested upon first user interaction if not already active
      var fsUserTapHandler = function() {
        requestAppFullscreen();
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.isFullscreen) {
          window.removeEventListener('pointerdown', fsUserTapHandler);
          window.removeEventListener('click', fsUserTapHandler);
        }
      };
      window.addEventListener('pointerdown', fsUserTapHandler, { passive: true });
      window.addEventListener('click', fsUserTapHandler, { passive: true });

      // Screen Layout & Orientation Controller
      window.SporeLayout = {
        isPortrait: function() {
          var winW = window.innerWidth || (window.screen ? window.screen.width : 0);
          var winH = window.innerHeight || (window.screen ? window.screen.height : 0);
          return winW < winH;
        },

        requestFullscreen: function() {
          requestAppFullscreen();
        },

        exitFullscreen: function() {
          if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.exitFullscreen === 'function') {
            try { window.Telegram.WebApp.exitFullscreen(); } catch (e) {}
          }
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(function() {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        },

        addToHomeScreen: function() {
          if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.addToHomeScreen === 'function') {
            try {
              window.Telegram.WebApp.addToHomeScreen();
            } catch (e) {
              console.warn('[TelegramWebApp] addToHomeScreen error:', e);
            }
          }
        },

        isFullscreen: function() {
          if (window.Telegram && window.Telegram.WebApp && typeof window.Telegram.WebApp.isFullscreen !== 'undefined') {
            return !!window.Telegram.WebApp.isFullscreen;
          }
          return !!(document.fullscreenElement || document.webkitFullscreenElement);
        },

        setOrientationLock: function(locked) {
          if (window.Telegram && window.Telegram.WebApp) {
            try {
              if (locked) {
                if (typeof window.Telegram.WebApp.lockOrientation === 'function') {
                  window.Telegram.WebApp.lockOrientation();
                }
              } else {
                if (typeof window.Telegram.WebApp.unlockOrientation === 'function') {
                  window.Telegram.WebApp.unlockOrientation();
                }
              }
            } catch (e) {
              console.warn('[TelegramWebApp] lockOrientation error:', e);
            }
          }

          if (!locked && window.screen && window.screen.orientation && typeof window.screen.orientation.unlock === 'function') {
            try {
              window.screen.orientation.unlock();
            } catch (e) {}
          }
        },

        requestRotateLandscape: function() {
          var handled = false;

          if (window.Telegram && window.Telegram.WebApp) {
            try {
              if (typeof window.Telegram.WebApp.lockOrientation === 'function') {
                window.Telegram.WebApp.lockOrientation('landscape');
                handled = true;
              }
            } catch (e) {}
          }

          var docEl = document.documentElement;
          var reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;

          var lockPromise = Promise.resolve();
          if (reqFs && !document.fullscreenElement && !document.webkitFullscreenElement) {
            lockPromise = reqFs.call(docEl).catch(function(err) {
              console.warn('[SporeLayout] Fullscreen request rejected:', err);
            });
          }

          lockPromise.then(function() {
            if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
              return window.screen.orientation.lock('landscape').catch(function(err) {
                console.warn('[SporeLayout] Orientation lock rejected:', err);
                window.SporeLayout.showRotateOverlay();
              });
            } else {
              window.SporeLayout.showRotateOverlay();
            }
          });
        },

        showRotateOverlay: function() {
          var overlay = document.getElementById('rotate-prompt-overlay');
          if (overlay) {
            overlay.style.display = 'flex';
          }
        },

        hideRotateOverlay: function() {
          var overlay = document.getElementById('rotate-prompt-overlay');
          if (overlay) {
            overlay.style.display = 'none';
          }
        }
      };

      var dismissBtn = document.getElementById('rotate-dismiss-btn');
      if (dismissBtn) {
        dismissBtn.onclick = function() {
          window.SporeLayout.hideRotateOverlay();
        };
      }
      var overlayElem = document.getElementById('rotate-prompt-overlay');
      if (overlayElem) {
        overlayElem.onclick = function(e) {
          if (e.target === overlayElem) {
            window.SporeLayout.hideRotateOverlay();
          }
        };
      }

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var ts = Date.now();
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js?v=" + ts;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data?v=" + ts,
        frameworkUrl: buildUrl + "/WebGL.framework.js?v=" + ts,
        codeUrl: buildUrl + "/WebGL.wasm?v=" + ts,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SporeTD",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        dataCaching: false
      };

      canvas.style.width = "100%";
      canvas.style.height = "100%";

      document.querySelector("#unity-loading-bar").style.display = "block";

      if (window.indexedDB) {
        try { window.indexedDB.deleteDatabase("UnityCache"); } catch(e) {}
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.__unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
