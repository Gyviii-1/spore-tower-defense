<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Spore TD (Unity WebGL)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css?v=20261111_nobars">
    <!-- Instant Asset Preloads for Fast Mobile Startup -->
    <link rel="preload" href="TemplateData/splash_logo.png?v=20261110_pc_v4" as="image">
    <link rel="preload" href="Build/spore_v17.loader.js?v=20261110_pc_v5" as="script" crossorigin="anonymous">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #14121A;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        display: block;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: #161616;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #161616;
      }

      /* Splash Screen Container */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #161616;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Crisp Centered Brand Showcase */
      #splash-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-20px);
        z-index: 2;
        pointer-events: none;
      }

      #splash-logo-wrapper {
        width: min(200px, 48vw);
        height: min(200px, 48vw);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        image-rendering: -webkit-optimize-contrast;
      }

      #splash-title {
        margin-top: 18px;
        color: #ffffff;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 5px;
        text-align: center;
      }

      #splash-subtitle {
        margin-top: 6px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 2px;
      }

      /* Sleek Minimalist Progress Bar */
      #splash-loader-bar {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        max-width: 80%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 10;
        transition: opacity 0.3s ease;
      }

      #splash-loader-track {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }

      #splash-loader-fill {
        height: 100%;
        width: 0%;
        background: #e53935;
        border-radius: 2px;
        transition: width 0.2s ease-out;
      }

      #splash-loader-text {
        color: rgba(255, 255, 255, 0.65);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
      }

      /* Pulsating tap prompt */
      @keyframes pulseBlinkSlow {
        0% { opacity: 0.25; transform: translateX(-50%) scale(0.97); }
        50% { opacity: 1.0; transform: translateX(-50%) scale(1.02); }
        100% { opacity: 0.25; transform: translateX(-50%) scale(0.97); }
      }

      #splash-prompt {
        display: none;
        position: absolute;
        bottom: 45px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
        padding: 10px 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 16px rgba(229, 57, 53, 0.35);
        animation: pulseBlinkSlow 2.0s ease-in-out infinite;
        cursor: pointer;
        white-space: nowrap;
        z-index: 10;
      }

      /* Fallback Overlay for Portrait / Rotate Device Prompt */
      #rotate-prompt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(12, 10, 16, 0.94);
        z-index: 9999999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .rotate-prompt-box {
        background: #221C2B;
        border: 2px solid #382D48;
        border-radius: 16px;
        padding: 28px 24px;
        max-width: 380px;
        text-align: center;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      }

      .rotate-icon {
        font-size: 40px;
        margin-bottom: 14px;
      }

      .rotate-title {
        font-size: 20px;
        font-weight: bold;
        color: #F6F1E7;
        margin-bottom: 8px;
      }

      .rotate-desc {
        font-size: 15px;
        color: #C9BFC8;
        line-height: 1.4;
        margin-bottom: 20px;
      }

      .rotate-dismiss-btn {
        background: #6EE7B7;
        color: #0C0A10;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        padding: 12px 28px;
        cursor: pointer;
        transition: transform 0.1s ease, background 0.1s ease;
      }

      .rotate-dismiss-btn:hover {
        background: #A7F3D0;
        transform: scale(1.03);
      }

      .rotate-dismiss-btn:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <!-- Fullscreen Splash Overlay -->
    <div id="splash-screen">
      <div id="splash-hero">
        <div id="splash-logo-wrapper">
          <img id="splash-logo" src="TemplateData/splash_logo.png?v=20261029_v13" alt="SAM Logo" />
        </div>
        <div id="splash-title">SPORE</div>
        <div id="splash-subtitle">Tower Defence</div>
      </div>

      <div id="splash-loader-bar">
        <div id="splash-loader-track">
          <div id="splash-loader-fill"></div>
        </div>
        <div id="splash-loader-text">0%</div>
      </div>

      <div id="splash-prompt">Нажмите, чтобы продолжить</div>
    </div>

      <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar" style="display:none !important;"></div>
        <div id="unity-warning"> </div>
        <div id="unity-footer" style="display:none !important;">
          <div id="unity-logo-title-footer"></div>
          <div id="unity-fullscreen-button"></div>
          <div id="unity-build-title">SporeTD</div>
        </div>
      </div>

    <!-- Rotate Device Overlay (iOS / unsupported orientation lock fallback) -->
    <div id="rotate-prompt-overlay" style="display:none;">
      <div class="rotate-prompt-box">
        <div class="rotate-icon">📱 ➔ 🔄</div>
        <div class="rotate-title">Поверните устройство</div>
        <div class="rotate-desc">Для комфортной игры переверните экран в горизонтальное положение.</div>
        <button class="rotate-dismiss-btn" id="rotate-dismiss-btn">Продолжить</button>
      </div>
    </div>

    <script>
      // Telegram WebApp init & immediate expand / fullscreen
      function tryExpandTelegram() {
        if (window.Telegram && window.Telegram.WebApp) {
          try {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.requestFullscreen) {
              window.Telegram.WebApp.requestFullscreen();
            }
            if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#14121A');
            if (window.Telegram.WebApp.setBackgroundColor) window.Telegram.WebApp.setBackgroundColor('#14121A');
          } catch (e) {
            console.warn('Telegram WebApp init warning:', e);
          }
        }
      }
      tryExpandTelegram();

      // Screen Layout & Orientation Controller
      window.SporeLayout = {
        isPortrait: function() {
          var winW = window.innerWidth || (window.screen ? window.screen.width : 0);
          var winH = window.innerHeight || (window.screen ? window.screen.height : 0);
          return winW < winH;
        },

        setOrientationLock: function(locked) {
          if (window.Telegram && window.Telegram.WebApp) {
            try {
              if (locked) {
                if (typeof window.Telegram.WebApp.lockOrientation === 'function') {
                  window.Telegram.WebApp.lockOrientation();
                }
              } else {
                if (typeof window.Telegram.WebApp.unlockOrientation === 'function') {
                  window.Telegram.WebApp.unlockOrientation();
                }
              }
            } catch (e) {
              console.warn('[TelegramWebApp] lockOrientation error:', e);
            }
          }

          if (!locked && window.screen && window.screen.orientation && typeof window.screen.orientation.unlock === 'function') {
            try {
              window.screen.orientation.unlock();
            } catch (e) {}
          }
        },

        requestRotateLandscape: function() {
          var handled = false;

          if (window.Telegram && window.Telegram.WebApp) {
            try {
              if (typeof window.Telegram.WebApp.lockOrientation === 'function') {
                window.Telegram.WebApp.lockOrientation('landscape');
                handled = true;
              }
            } catch (e) {}
          }

          var docEl = document.documentElement;
          var reqFs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;

          var lockPromise = Promise.resolve();
          if (reqFs && !document.fullscreenElement && !document.webkitFullscreenElement) {
            lockPromise = reqFs.call(docEl).catch(function(err) {
              console.warn('[SporeLayout] Fullscreen request rejected:', err);
            });
          }

          lockPromise.then(function() {
            if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
              return window.screen.orientation.lock('landscape').catch(function(err) {
                console.warn('[SporeLayout] Orientation lock rejected:', err);
                window.SporeLayout.showRotateOverlay();
              });
            } else {
              window.SporeLayout.showRotateOverlay();
            }
          });
        },

        showRotateOverlay: function() {
          var overlay = document.getElementById('rotate-prompt-overlay');
          if (overlay) {
            overlay.style.display = 'flex';
          }
        },

        hideRotateOverlay: function() {
          var overlay = document.getElementById('rotate-prompt-overlay');
          if (overlay) {
            overlay.style.display = 'none';
          }
        }
      };

      var dismissBtn = document.getElementById('rotate-dismiss-btn');
      if (dismissBtn) {
        dismissBtn.onclick = function() {
          window.SporeLayout.hideRotateOverlay();
        };
      }
      var overlayElem = document.getElementById('rotate-prompt-overlay');
      if (overlayElem) {
        overlayElem.onclick = function(e) {
          if (e.target === overlayElem) {
            window.SporeLayout.hideRotateOverlay();
          }
        };
      }

      var splash = document.getElementById('splash-screen');
      var loaderBar = document.getElementById('splash-loader-bar');
      var loaderFill = document.getElementById('splash-loader-fill');
      var loaderText = document.getElementById('splash-loader-text');
      var splashPrompt = document.getElementById('splash-prompt');

      var isGameReady = false;
      var currentProgress = 0;
      var hasStarted = false;

      function updateLoaderProgress(p) {
        currentProgress = Math.max(currentProgress, p);
        var percent = Math.min(100, Math.round(currentProgress * 100));
        if (loaderFill) {
          loaderFill.style.width = percent + '%';
        }
        if (loaderText) {
          loaderText.textContent = percent + '%';
        }
      }

      function showContinuePrompt() {
        if (loaderBar) loaderBar.style.display = 'none';
        if (splashPrompt) splashPrompt.style.display = 'block';
      }

      function enterFullscreenAndStart() {
        if (hasStarted) return;
        hasStarted = true;
        tryExpandTelegram();

        try {
          var de = document.documentElement;
          var p = null;
          if (de.requestFullscreen) p = de.requestFullscreen();
          else if (de.webkitRequestFullscreen) p = de.webkitRequestFullscreen();
          else if (de.mozRequestFullScreen) p = de.mozRequestFullScreen();
          else if (de.msRequestFullscreen) p = de.msRequestFullscreen();
          if (p && p.catch) p.catch(function(e) { console.warn('Fullscreen rejected:', e); });
        } catch (e) {
          console.warn('Fullscreen request:', e);
        }
        // Unlock Web Audio context on mobile browsers
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (window._audioContext && window._audioContext.state === 'suspended') {
              window._audioContext.resume();
            }
          }
          if (typeof WEBAudio !== 'undefined' && WEBAudio.audioContext && WEBAudio.audioContext.state === 'suspended') {
            WEBAudio.audioContext.resume();
          }
        } catch (e) {
          console.warn('Audio resume:', e);
        }
        dismissSplash();
      }

      function dismissSplash() {
        if (!splash || splash.dataset.dismissed) return;
        splash.dataset.dismissed = 'true';
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }

      if (splash) {
        var onUserAction = function(e) {
          if (isGameReady) {
            if (e && e.cancelable && e.type === 'touchend') e.preventDefault();
            enterFullscreenAndStart();
          }
        };
        splash.addEventListener('click', onUserAction);
        splash.addEventListener('touchend', onUserAction, { passive: false });
        splash.addEventListener('pointerup', onUserAction);
      }

      // Синхронизация роли игрока с Unity GameUI
      function syncPlayerRole() {
        if (!window.__unityInstance) return;
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var paramRole = urlParams.get('role');
          var paramNick = urlParams.get('nick');
          if (paramRole) {
            window.__unityInstance.SendMessage('Canvas', 'SetPlayerProfile', JSON.stringify({
              role: paramRole,
              nick: paramNick || 'Игрок'
            }));
            return;
          }

          var unsafeUser = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe) ? window.Telegram.WebApp.initDataUnsafe.user : null;
          var fallbackNick = unsafeUser ? (unsafeUser.username ? '@' + unsafeUser.username : (unsafeUser.first_name || 'Игрок')) : 'Игрок';

          var initData = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp.initData : '';
          if (initData) {
            fetch('/api/me', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ initData: initData })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.ok && window.__unityInstance) {
                window.__unityInstance.SendMessage('Canvas', 'SetPlayerProfile', JSON.stringify({
                  role: data.role || 'player',
                  nick: data.nick || fallbackNick
                }));
              }
            })
            .catch(function(err) {
              console.warn('[SporeTD] syncPlayerRole error:', err);
              if (window.__unityInstance && fallbackNick !== 'Игрок') {
                window.__unityInstance.SendMessage('Canvas', 'SetPlayerProfile', JSON.stringify({
                  nick: fallbackNick
                }));
              }
            });
          } else if (unsafeUser && window.__unityInstance && fallbackNick !== 'Игрок') {
            window.__unityInstance.SendMessage('Canvas', 'SetPlayerProfile', JSON.stringify({
              nick: fallbackNick
            }));
          }
        } catch (e) {
          console.warn('[SporeTD] syncPlayerRole exception:', e);
        }
      }

      // Вызывается из Unity (GameUI.cs) ровно в момент, когда меню открыто
      window.onUnityGameReady = function() {
        console.log("[SporeTD] Unity Game Menu is Ready!");
        isGameReady = true;
        updateLoaderProgress(1.0);
        showContinuePrompt();
        syncPlayerRole();
      };

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "20261110_pc_v5";
      var loaderUrl = buildUrl + "/spore_v17.loader.js?v=" + buildVersion;
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/spore_v17.data.unityweb?v=" + buildVersion,
        frameworkUrl: buildUrl + "/spore_v17.framework.js.unityweb?v=" + buildVersion,
        codeUrl: buildUrl + "/spore_v17.wasm.unityweb?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SporeTD",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        errorHandler: function(err, type) {
          console.warn('[SporeTD] Suppressed non-fatal runtime error:', err, type);
        },
        devicePixelRatio: dpr,
        matchWebGLToCanvasSize: true,
        autoSyncPersistentDataPath: true,
        cacheControl: function(url) {
          // Instruct UnityCache (IndexedDB) to cache WASM and data permanently
          return "immutable";
        },
      };

      canvas.style.width = "100%";
      canvas.style.height = "100%";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.crossOrigin = "anonymous";
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          updateLoaderProgress(progress);
        }).then((unityInstance) => {
          window.__unityInstance = unityInstance;
          syncPlayerRole();
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
          // Fallback: если callback из C# задержался, через 1.5 секунды после инициализации
          setTimeout(function() {
            if (!isGameReady) {
              window.onUnityGameReady();
            }
          }, 1500);
        }).catch((message) => {
          dismissSplash();
          console.error("Unity load error:", message);
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
