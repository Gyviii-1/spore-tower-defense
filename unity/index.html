<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Spore TD (Unity WebGL)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Instant Asset Preloads for Fast Mobile Startup -->
    <link rel="preload" href="TemplateData/splash.mp4?v=20261028_v2" as="video" type="video/mp4">
    <link rel="preload" href="TemplateData/splash_logo.png?v=20261028_v2" as="image">
    <link rel="preload" href="Build/spore_v9.loader.js?v=20261028_v2" as="script">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #161616;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: #161616;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #161616;
      }

      /* Splash Screen Container */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #161616;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Video Splash Element */
      #splash-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #161616;
        z-index: 1;
        pointer-events: none;
      }

      /* Logo & Brand Fallback/Poster */
      #splash-hero {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transform: translateY(-24px);
        z-index: 2;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }

      #splash-logo-wrapper {
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      #splash-title {
        margin-top: 18px;
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 3px;
        text-align: center;
      }

      /* Skip Button */
      #splash-skip-btn {
        position: absolute;
        top: 24px;
        right: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 20px;
        padding: 7px 16px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: opacity 0.25s ease, background 0.2s ease;
      }
      #splash-skip-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      /* Sleek Minimalist Progress Bar */
      #splash-loader-bar {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        width: 220px;
        max-width: 80%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 10;
        transition: opacity 0.3s ease;
      }

      #splash-loader-track {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 2px;
        overflow: hidden;
      }

      #splash-loader-fill {
        height: 100%;
        width: 0%;
        background: #e53935;
        border-radius: 2px;
        transition: width 0.2s ease-out;
      }

      #splash-loader-text {
        color: rgba(255, 255, 255, 0.65);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        font-variant-numeric: tabular-nums;
      }

      /* Pulsating tap prompt */
      @keyframes pulseBlinkSlow {
        0% { opacity: 0.20; transform: translateX(-50%) scale(0.97); }
        50% { opacity: 1.0; transform: translateX(-50%) scale(1.02); }
        100% { opacity: 0.20; transform: translateX(-50%) scale(0.97); }
      }

      #splash-prompt {
        display: none;
        position: absolute;
        bottom: 45px;
        left: 50%;
        transform: translateX(-50%);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 2px;
        text-align: center;
        text-transform: uppercase;
        padding: 10px 24px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 16px rgba(229, 57, 53, 0.35);
        animation: pulseBlinkSlow 2.0s ease-in-out infinite;
        cursor: pointer;
        white-space: nowrap;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <!-- Fullscreen Splash Overlay -->
    <div id="splash-screen">
      <video id="splash-video" src="TemplateData/splash.mp4?v=20261028_v2" playsinline webkit-playsinline autoplay muted preload="auto"></video>
      <div id="splash-hero">
        <div id="splash-logo-wrapper">
          <img id="splash-logo" src="TemplateData/splash_logo.png?v=20261028_v2" alt="SAM Logo" />
        </div>
        <div id="splash-title">SPORE TD</div>
      </div>
      <div id="splash-skip-btn">Пропустить ▶</div>

      <div id="splash-loader-bar">
        <div id="splash-loader-track">
          <div id="splash-loader-fill"></div>
        </div>
        <div id="splash-loader-text">0%</div>
      </div>

      <div id="splash-prompt">Нажмите, чтобы продолжить</div>
    </div>

    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar" style="display:none !important;"></div>
      <div id="unity-warning"> </div>
      <div id="unity-footer" style="display:none !important;">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SporeTD</div>
      </div>
    </div>

    <script>
      // Telegram WebApp init & immediate expand / fullscreen
      function tryExpandTelegram() {
        if (window.Telegram && window.Telegram.WebApp) {
          try {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            if (window.Telegram.WebApp.requestFullscreen) {
              window.Telegram.WebApp.requestFullscreen();
            }
            if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#161616');
            if (window.Telegram.WebApp.setBackgroundColor) window.Telegram.WebApp.setBackgroundColor('#161616');
          } catch (e) {
            console.warn('Telegram WebApp init warning:', e);
          }
        }
      }
      tryExpandTelegram();

      var splash = document.getElementById('splash-screen');
      var splashVideo = document.getElementById('splash-video');
      var splashHero = document.getElementById('splash-hero');
      var skipBtn = document.getElementById('splash-skip-btn');
      var loaderBar = document.getElementById('splash-loader-bar');
      var loaderFill = document.getElementById('splash-loader-fill');
      var loaderText = document.getElementById('splash-loader-text');
      var splashPrompt = document.getElementById('splash-prompt');

      var isGameReady = false;
      var isVideoEnded = false;
      var currentProgress = 0;
      var hasStarted = false;

      function updateLoaderProgress(p) {
        currentProgress = Math.max(currentProgress, p);
        var percent = Math.min(100, Math.round(currentProgress * 100));
        if (loaderFill) {
          loaderFill.style.width = percent + '%';
        }
        if (loaderText) {
          loaderText.textContent = percent + '%';
        }
      }

      function showContinuePrompt() {
        if (loaderBar) loaderBar.style.display = 'none';
        if (skipBtn) skipBtn.style.display = 'none';
        if (splashPrompt) splashPrompt.style.display = 'block';
      }

      function onVideoFinished() {
        if (isVideoEnded) return;
        isVideoEnded = true;
        if (splashVideo) {
          try {
            if (splashVideo.duration) {
              splashVideo.currentTime = Math.max(0, splashVideo.duration - 0.05);
            }
            splashVideo.pause();
          } catch (e) {}
        }
        if (isGameReady) {
          showContinuePrompt();
        } else {
          if (loaderBar) loaderBar.style.display = 'flex';
        }
      }

      if (splashVideo) {
        splashVideo.addEventListener('playing', function() {
          if (splashHero) splashHero.style.opacity = '0';
        });
        splashVideo.addEventListener('ended', onVideoFinished);
        splashVideo.addEventListener('timeupdate', function() {
          if (splashVideo.duration && splashVideo.currentTime >= splashVideo.duration - 0.15) {
            onVideoFinished();
          }
        });
        // Попытка плавного автозапуска
        var playPromise = splashVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(function() {
            var tryPlayOnTouch = function() {
              if (splashVideo && !isVideoEnded) {
                splashVideo.play().catch(function() {});
              }
            };
            window.addEventListener('touchstart', tryPlayOnTouch, { once: true, passive: true });
            window.addEventListener('click', tryPlayOnTouch, { once: true });
          });
        }
        setTimeout(function() {
          if (!isVideoEnded) onVideoFinished();
        }, 11000);
      }

      if (skipBtn) {
        skipBtn.onclick = function(e) {
          if (e) e.stopPropagation();
          onVideoFinished();
          if (isGameReady) {
            enterFullscreenAndStart();
          }
        };
      }

      function enterFullscreenAndStart() {
        if (hasStarted) return;
        hasStarted = true;
        tryExpandTelegram();
        try {
          var de = document.documentElement;
          if (de.requestFullscreen) de.requestFullscreen();
          else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
          else if (de.mozRequestFullScreen) de.mozRequestFullScreen();
          else if (de.msRequestFullscreen) de.msRequestFullscreen();
        } catch (e) {
          console.warn('Fullscreen request:', e);
        }
        // Unlock Web Audio context on mobile browsers
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            if (window._audioContext && window._audioContext.state === 'suspended') {
              window._audioContext.resume();
            }
          }
          if (typeof WEBAudio !== 'undefined' && WEBAudio.audioContext && WEBAudio.audioContext.state === 'suspended') {
            WEBAudio.audioContext.resume();
          }
        } catch (e) {
          console.warn('Audio resume:', e);
        }
        dismissSplash();
      }

      function dismissSplash() {
        if (!splash || splash.dataset.dismissed) return;
        splash.dataset.dismissed = 'true';
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }

      if (splash) {
        var onUserAction = function(e) {
          if (isGameReady && (isVideoEnded || (splashVideo && splashVideo.currentTime > 2.0))) {
            if (e && e.cancelable && e.type === 'touchend') e.preventDefault();
            enterFullscreenAndStart();
          } else if (splashVideo && !isVideoEnded && splashVideo.paused) {
            splashVideo.play().catch(function() {});
          }
        };
        splash.addEventListener('click', onUserAction);
        splash.addEventListener('touchend', onUserAction, { passive: false });
        splash.addEventListener('pointerup', onUserAction);
      }

      // Вызывается из Unity (GameUI.cs) ровно в момент, когда меню открыто
      window.onUnityGameReady = function() {
        console.log("[SporeTD] Unity Game Menu is Ready!");
        isGameReady = true;
        updateLoaderProgress(1.0);
        if (isVideoEnded) {
          showContinuePrompt();
        }
      };

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "20261028_v2";
      var loaderUrl = buildUrl + "/spore_v9.loader.js?v=" + buildVersion;
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/spore_v9.data.unityweb?v=" + buildVersion,
        frameworkUrl: buildUrl + "/spore_v9.framework.js.unityweb?v=" + buildVersion,
        codeUrl: buildUrl + "/spore_v9.wasm.unityweb?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SporeTD",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: dpr,
        matchWebGLToCanvasSize: true,
        autoSyncPersistentDataPath: true,
        cacheControl: function(url) {
          // Instruct UnityCache (IndexedDB) to cache WASM and data permanently
          return "immutable";
        },
      };

      canvas.style.width = "100%";
      canvas.style.height = "100%";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          updateLoaderProgress(progress);
        }).then((unityInstance) => {
          window.__unityInstance = unityInstance;
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
          // Fallback: если callback из C# задержался, через 1.5 секунды после инициализации
          setTimeout(function() {
            if (!isGameReady) {
              window.onUnityGameReady();
            }
          }, 1500);
        }).catch((message) => {
          dismissSplash();
          console.error("Unity load error:", message);
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
