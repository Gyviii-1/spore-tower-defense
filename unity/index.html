<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Spore TD (Unity WebGL)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Instant Asset Preloads for Fast Mobile Startup -->
    <link rel="preload" href="TemplateData/splash_logo.png" as="image">
    <link rel="preload" href="Build/spore_v4.loader.js?v=20261027_v5" as="script">
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: #000000;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        background: #000000;
      }

      /* Splash Screen Container */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Background Ambient Red Glow */
      #splash-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(235, 30, 45, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
        pointer-events: none;
        animation: splashGlowPulse 3s ease-in-out infinite alternate;
        z-index: 1;
      }

      @keyframes splashGlowPulse {
        0% { transform: scale(0.85); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.95; }
      }

      /* Logo & Brand Centerpiece (Always visible immediately) */
      #splash-hero {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
        pointer-events: none;
        transform: translateY(-28px);
      }

      #splash-logo-wrapper {
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        filter: drop-shadow(0 0 20px rgba(235, 30, 45, 0.35));
        animation: logoFloat 3.5s ease-in-out infinite alternate;
      }

      @keyframes logoFloat {
        0% { transform: translateY(0); }
        100% { transform: translateY(-5px); }
      }

      #splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }

      #splash-title {
        margin-top: 14px;
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 3px;
        text-shadow: 0 0 16px rgba(255, 255, 255, 0.35), 0 2px 8px rgba(0, 0, 0, 0.9);
      }

      #splash-subtitle {
        margin-top: 4px;
        color: #e53935;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3.5px;
        text-shadow: 0 0 10px rgba(229, 57, 53, 0.5);
      }

      /* Fullscreen Video Splash (Overlaid if autoplay is supported) */
      #splash-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      /* Sleek Bottom Loading Container */
      #splash-loader-bar {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        width: 250px;
        max-width: 82%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 7px;
        z-index: 10;
        pointer-events: none;
      }

      #splash-loader-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
      }

      #splash-loader-hint {
        color: rgba(255, 255, 255, 0.7);
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      #splash-loader-text {
        color: #00f2fe;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.5px;
      }

      #splash-loader-track {
        width: 100%;
        height: 5px;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 3px;
        overflow: hidden;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
      }

      #splash-loader-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e53935 0%, #ff5252 50%, #00f2fe 100%);
        border-radius: 3px;
        transition: width 0.25s ease-out;
        box-shadow: 0 0 10px rgba(79, 172, 254, 0.7);
      }

      /* Skip Button */
      #splash-skip-btn {
        position: absolute;
        top: 24px;
        right: 20px;
        background: rgba(10, 15, 25, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        padding: 8px 18px;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        display: none;
        transition: opacity 0.3s ease, transform 0.15s ease;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        z-index: 1000000;
      }
      #splash-skip-btn:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Fullscreen Splash Overlay -->
    <div id="splash-screen">
      <div id="splash-glow"></div>

      <!-- Main Logo & Brand Hero (ALWAYS VISIBLE from Millisecond 0) -->
      <div id="splash-hero">
        <div id="splash-logo-wrapper">
          <img id="splash-logo" src="TemplateData/splash_logo.png" alt="SAM Logo" />
        </div>
        <div id="splash-title">SPORE TD</div>
        <div id="splash-subtitle">TOWER DEFENSE</div>
      </div>

      <!-- Fullscreen Video Splash (Overlaid smoothly if autoplay succeeds) -->
      <video id="splash-video" src="TemplateData/splash.mp4?v=20261027_v5" poster="TemplateData/splash_logo.png" playsinline webkit-playsinline autoplay muted preload="auto"></video>

      <!-- Skip Button -->
      <div id="splash-skip-btn">Пропустить ▶</div>

      <!-- Sleek Bottom Loading Container -->
      <div id="splash-loader-bar">
        <div id="splash-loader-header">
          <span id="splash-loader-hint">Подготовка ядра...</span>
          <span id="splash-loader-text">0%</span>
        </div>
        <div id="splash-loader-track">
          <div id="splash-loader-fill"></div>
        </div>
      </div>
    </div>

    <div id="unity-container" class="unity-mobile">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar" style="display:none !important;"></div>
      <div id="unity-warning"> </div>
      <div id="unity-footer" style="display:none !important;">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SporeTD</div>
      </div>
    </div>

    <script>
      // Telegram WebApp init
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          if (window.Telegram.WebApp.setHeaderColor) window.Telegram.WebApp.setHeaderColor('#000000');
          if (window.Telegram.WebApp.setBackgroundColor) window.Telegram.WebApp.setBackgroundColor('#000000');
        } catch (e) {
          console.warn('Telegram WebApp init warning:', e);
        }
      }

      var splash = document.getElementById('splash-screen');
      var splashVideo = document.getElementById('splash-video');
      var skipBtn = document.getElementById('splash-skip-btn');
      var loaderFill = document.getElementById('splash-loader-fill');
      var loaderText = document.getElementById('splash-loader-text');
      var loaderHint = document.getElementById('splash-loader-hint');

      var isGameReady = false;
      var isVideoEnded = false;
      var currentProgress = 0;

      function updateLoaderProgress(p) {
        currentProgress = Math.max(currentProgress, p);
        var percent = Math.min(100, Math.round(currentProgress * 100));
        if (loaderFill) {
          loaderFill.style.width = percent + '%';
        }
        if (loaderText) {
          loaderText.textContent = percent + '%';
        }
        if (loaderHint) {
          if (percent < 25) {
            loaderHint.textContent = 'Загрузка ядра...';
          } else if (percent < 75) {
            loaderHint.textContent = 'Загрузка ресурсов...';
          } else if (percent < 98) {
            loaderHint.textContent = 'Инициализация...';
          } else {
            loaderHint.textContent = 'Готово!';
          }
        }
      }

      function dismissSplash() {
        if (!splash || splash.dataset.dismissed) return;
        splash.dataset.dismissed = 'true';
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splashVideo) {
            try { splashVideo.pause(); } catch (e) {}
          }
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 500);
      }

      function enableSkipping() {
        if (!splash || splash.dataset.dismissed) return;
        if (skipBtn) {
          skipBtn.style.display = 'block';
          requestAnimationFrame(function() { skipBtn.style.opacity = '1'; });
          skipBtn.onclick = function(e) {
            e.stopPropagation();
            dismissSplash();
          };
        }
        splash.style.cursor = 'pointer';
        splash.onclick = function() {
          dismissSplash();
        };
      }

      function onVideoFinished() {
        if (isVideoEnded) return;
        isVideoEnded = true;
        try { splashVideo.pause(); } catch (e) {}
        if (splashVideo) splashVideo.style.opacity = '0';

        if (isGameReady) {
          dismissSplash();
        }
      }

      if (splashVideo) {
        splashVideo.muted = true;
        splashVideo.defaultMuted = true;
        splashVideo.playsInline = true;

        splashVideo.addEventListener('playing', function() {
          splashVideo.style.opacity = '1';
        });

        splashVideo.addEventListener('ended', onVideoFinished);
        splashVideo.addEventListener('timeupdate', function() {
          if (splashVideo.duration && splashVideo.currentTime >= splashVideo.duration - 0.25) {
            onVideoFinished();
          }
        });
        splashVideo.addEventListener('error', function() {
          onVideoFinished();
        });

        setTimeout(function() {
          if (!isVideoEnded) {
            onVideoFinished();
          }
        }, 10500);

        var playPromise = splashVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(function() {
            // Autoplay blocked by mobile browser: keep static logo visible
            window.addEventListener('touchstart', function() {
              splashVideo.play().catch(function() {});
            }, { once: true });
          });
        }
      }

      // Вызывается из Unity (GameUI.cs) ровно в момент, когда меню открыто
      window.onUnityGameReady = function() {
        console.log("[SporeTD] Unity Game Menu is Ready!");
        isGameReady = true;
        updateLoaderProgress(1.0);

        if (!isVideoEnded) {
          enableSkipping();
          setTimeout(dismissSplash, 400);
        } else {
          setTimeout(dismissSplash, 300);
        }
      };

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "20261027_v5";
      var loaderUrl = buildUrl + "/spore_v4.loader.js?v=" + buildVersion;
      var dpr = Math.min(window.devicePixelRatio || 1, 3);
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/spore_v4.data.unityweb?v=" + buildVersion,
        frameworkUrl: buildUrl + "/spore_v4.framework.js.unityweb?v=" + buildVersion,
        codeUrl: buildUrl + "/spore_v4.wasm.unityweb?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SporeTD",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: dpr,
        matchWebGLToCanvasSize: true,
        cacheControl: function(url) {
          // Instruct UnityCache (IndexedDB) to cache WASM and data permanently
          return "immutable";
        },
      };

      canvas.style.width = "100%";
      canvas.style.height = "100%";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          updateLoaderProgress(progress);
        }).then((unityInstance) => {
          window.__unityInstance = unityInstance;
          var fsBtn = document.querySelector("#unity-fullscreen-button");
          if (fsBtn) {
            fsBtn.onclick = () => {
              unityInstance.SetFullscreen(1);
            };
          }
          // Fallback: если callback из C# задержался, через 1.5 секунды после инициализации
          setTimeout(function() {
            if (!isGameReady) {
              window.onUnityGameReady();
            }
          }, 1500);
        }).catch((message) => {
          dismissSplash();
          console.error("Unity load error:", message);
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
